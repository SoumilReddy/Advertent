<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aak's Period App</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aak's Period App" />
<meta name="theme-color" content="#13111a" />

<style>
  html, body { margin: 0; padding: 0; background: #13111a; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const DEFAULT_CYCLE_LENGTH = 28;
const DEFAULT_PERIOD_LENGTH = 5;

function parseDate(str) {
  return new Date(str + "T00:00:00");
}
function formatDate(date) {
  return date.toISOString().split("T")[0];
}
function getToday() {
  return formatDate(new Date());
}
function addDays(dateStr, days) {
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + days);
  return formatDate(d);
}
function daysBetween(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}
function getDayLabel(dateStr) {
  const d = parseDate(dateStr);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function PeriodTracker() {
  const [cycles, setCycles] = useState([]);
  const [cycleLength, setCycleLength] = useState(DEFAULT_CYCLE_LENGTH);
  const [periodLength, setPeriodLength] = useState(DEFAULT_PERIOD_LENGTH);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const TODAY = getToday();

  useEffect(() => {
    try {
      const c = localStorage.getItem("pt_cycles");
      const cl = localStorage.getItem("pt_cycle_length");
      const pl = localStorage.getItem("pt_period_length");
      const loadedCycles = c ? JSON.parse(c) : [{ start: TODAY, id: Date.now() }];
      setCycles(loadedCycles);
      setCycleLength(cl ? parseInt(cl) : DEFAULT_CYCLE_LENGTH);
      setPeriodLength(pl ? parseInt(pl) : DEFAULT_PERIOD_LENGTH);
    } catch {
      setCycles([{ start: TODAY, id: Date.now() }]);
    }
    setLoading(false);
  }, []);

  function save(newCycles, newCL, newPL) {
    localStorage.setItem("pt_cycles", JSON.stringify(newCycles));
    localStorage.setItem("pt_cycle_length", String(newCL ?? cycleLength));
    localStorage.setItem("pt_period_length", String(newPL ?? periodLength));
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }

  function logPeriodToday() {
    const exists = cycles.find((c) => c.start === TODAY);
    if (exists) { showToast("Today is already logged."); return; }
    const updated = [...cycles, { start: TODAY, id: Date.now() }].sort((a, b) =>
      a.start.localeCompare(b.start)
    );
    setCycles(updated);
    save(updated, cycleLength, periodLength);
    showToast("Period logged for today!");
  }

  function deleteCycle(id) {
    const updated = cycles.filter((c) => c.id !== id);
    setCycles(updated);
    save(updated, cycleLength, periodLength);
    showToast("Entry removed.");
  }

  function updateSettings(cl, pl) {
    setCycleLength(cl);
    setPeriodLength(pl);
    save(cycles, cl, pl);
    showToast("Settings saved.");
  }

  const sorted = [...cycles].sort((a, b) => b.start.localeCompare(a.start));
  const last = sorted[0];

  let predictedNext = null;
  let predictedOvulation = null;
  let currentDay = null;
  let phase = null;
  let daysUntilNext = null;
  let avgCycle = cycleLength;

  if (last) {
    if (cycles.length >= 2) {
      const gaps = sorted.slice(0, -1).map((c, i) => daysBetween(sorted[i + 1].start, c.start));
      avgCycle = Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length);
    }
    predictedNext = addDays(last.start, avgCycle);
    predictedOvulation = addDays(last.start, avgCycle - 14);
    currentDay = daysBetween(last.start, TODAY) + 1;
    daysUntilNext = daysBetween(TODAY, predictedNext);

    if (currentDay <= periodLength) phase = "period";
    else if (currentDay <= 7) phase = "follicular";
    else if (currentDay <= avgCycle - 11) phase = "follicular-mid";
    else if (currentDay <= avgCycle - 9) phase = "ovulation";
    else phase = "luteal";
  }

  const phaseInfo = {
    period: { label: "Period", color: "#e05c7a", emoji: "🌸", desc: "Hormone levels are low. Rest and warmth help." },
    follicular: { label: "Follicular", color: "#f0906a", emoji: "🌱", desc: "Energy rising as estrogen builds." },
    "follicular-mid": { label: "Follicular", color: "#f0906a", emoji: "🌱", desc: "Rising energy and focus. Good for starting things." },
    ovulation: { label: "Ovulation", color: "#c46fd4", emoji: "✨", desc: "Peak energy and social drive. Fertile window." },
    luteal: { label: "Luteal", color: "#7b8fcf", emoji: "🌙", desc: "Energy winds down. PMS possible in late luteal." },
  };

  const info = phase ? phaseInfo[phase] : null;

  function getCalendarDays() {
    const start = addDays(TODAY, -17);
    return Array.from({ length: 35 }, (_, i) => {
      const d = addDays(start, i);
      const isToday = d === TODAY;
      const isPeriod = cycles.some((c) => {
        const day = daysBetween(c.start, d) + 1;
        return day >= 1 && day <= periodLength;
      });
      const isPredictedPeriod = daysBetween(predictedNext, d) >= 0 && daysBetween(predictedNext, d) < periodLength && d > TODAY;
      const isOvulation = d === predictedOvulation;
      return { date: d, isToday, isPeriod, isPredictedPeriod, isOvulation };
    });
  }

  const calDays = last ? getCalendarDays() : [];
  const WEEKDAYS = ["S", "M", "T", "W", "T", "F", "S"];

  if (loading) return (
    <div style={{ minHeight: "100vh", background: "#13111a", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontFamily: "system-ui" }}>
      Loading…
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: "#13111a", color: "#f0eaf6", fontFamily: "'Segoe UI', system-ui, sans-serif", maxWidth: 420, margin: "0 auto", paddingBottom: 80 }}>
      {toast && (
        <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: "#2e2840", color: "#f0eaf6", padding: "10px 20px", borderRadius: 24, fontSize: 14, zIndex: 999, boxShadow: "0 4px 20px #0008", whiteSpace: "nowrap" }}>
          {toast}
        </div>
      )}

      {view === "home" && (
        <div>
          <div style={{ padding: "40px 24px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 13, color: "#a89fc4", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 4 }}>Aak's Period App</div>
              <div style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em" }}>
                {getDayLabel(TODAY)}
              </div>
            </div>
            {info && (
              <div style={{ background: info.color + "22", border: `1px solid ${info.color}55`, borderRadius: 16, padding: "8px 14px", textAlign: "center" }}>
                <div style={{ fontSize: 20 }}>{info.emoji}</div>
                <div style={{ fontSize: 11, color: info.color, fontWeight: 600, marginTop: 2 }}>{info.label}</div>
              </div>
            )}
          </div>

          {info && (
            <div style={{ margin: "20px 24px 0", background: "#1e1a2e", borderRadius: 20, padding: "20px", borderLeft: `3px solid ${info.color}` }}>
              <div style={{ fontSize: 13, color: "#a89fc4", marginBottom: 6 }}>Cycle day {currentDay} · {info.label} phase</div>
              <div style={{ fontSize: 15, color: "#ddd5f0", lineHeight: 1.5 }}>{info.desc}</div>
              {daysUntilNext !== null && (
                <div style={{ marginTop: 12, fontSize: 13, color: "#a89fc4" }}>
                  {daysUntilNext === 0 ? "Next period predicted today" :
                    daysUntilNext > 0 ? `Next period in ${daysUntilNext} day${daysUntilNext !== 1 ? "s" : ""}` :
                      `Period was due ${Math.abs(daysUntilNext)} day${Math.abs(daysUntilNext) !== 1 ? "s" : ""} ago`}
                  {" · "}{getDayLabel(predictedNext)}
                </div>
              )}
            </div>
          )}

          <div style={{ margin: "20px 24px 0" }}>
            <button
              onClick={logPeriodToday}
              style={{ width: "100%", padding: "16px", background: "#e05c7a", border: "none", borderRadius: 16, color: "#fff", fontSize: 16, fontWeight: 600, cursor: "pointer", letterSpacing: "0.01em" }}
            >
              🌸 Log period today
            </button>
          </div>

          <div style={{ margin: "12px 24px 0" }}>
            <a
              href="https://www.instagram.com/soumilreddy/?hl=en"
              target="_blank"
              rel="noopener noreferrer"
              style={{ display: "block", textAlign: "center", width: "100%", padding: "16px", background: "#1e1a2e", border: "1px solid #3a2e54", borderRadius: 16, color: "#e8deff", fontSize: 16, fontWeight: 600, cursor: "pointer", letterSpacing: "0.01em", textDecoration: "none", boxSizing: "border-box" }}
            >
              🤗 Click here for cuddles
            </a>
          </div>

          {calDays.length > 0 && (
            <div style={{ margin: "24px 24px 0", background: "#1e1a2e", borderRadius: 20, padding: 20 }}>
              <div style={{ fontSize: 13, color: "#a89fc4", marginBottom: 14, letterSpacing: "0.06em", textTransform: "uppercase" }}>Calendar</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
                {WEEKDAYS.map((d, i) => (
                  <div key={i} style={{ textAlign: "center", fontSize: 11, color: "#6b5f88", fontWeight: 600, paddingBottom: 4 }}>{d}</div>
                ))}
                {calDays.map((d, i) => {
                  let bg = "transparent", color = "#c4b8dc", border = "none";
                  if (d.isPeriod) { bg = "#e05c7a33"; color = "#e05c7a"; }
                  if (d.isPredictedPeriod) { bg = "#e05c7a18"; color = "#e05c7a88"; border = "1px dashed #e05c7a55"; }
                  if (d.isOvulation && !d.isPeriod) { bg = "#c46fd422"; color = "#c46fd4"; }
                  if (d.isToday) { bg = "#e05c7a"; color = "#fff"; border = "none"; }
                  return (
                    <div key={i} style={{ textAlign: "center", borderRadius: 8, padding: "5px 0", background: bg, color, border, fontSize: 13, fontWeight: d.isToday ? 700 : 400 }}>
                      {parseDate(d.date).getDate()}
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 14, flexWrap: "wrap" }}>
                {[["#e05c7a", "Period"], ["#e05c7a55", "Predicted"], ["#c46fd4", "Ovulation"]].map(([c, label]) => (
                  <div key={label} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "#a89fc4" }}>
                    <div style={{ width: 10, height: 10, borderRadius: 3, background: c }} />
                    {label}
                  </div>
                ))}
              </div>
            </div>
          )}

          {cycles.length >= 2 && (
            <div style={{ margin: "16px 24px 0", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {[
                ["Avg cycle", `${avgCycle} days`],
                ["Logged cycles", cycles.length],
              ].map(([label, val]) => (
                <div key={label} style={{ background: "#1e1a2e", borderRadius: 16, padding: "16px" }}>
                  <div style={{ fontSize: 12, color: "#7b6f9a", marginBottom: 6 }}>{label}</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: "#e8deff" }}>{val}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {view === "history" && (
        <div style={{ padding: "40px 24px 0" }}>
          <div style={{ fontSize: 13, color: "#a89fc4", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 4 }}>History</div>
          <div style={{ fontSize: 24, fontWeight: 700, marginBottom: 24 }}>Past cycles</div>
          {sorted.length === 0 && <div style={{ color: "#6b5f88", fontSize: 15 }}>No cycles logged yet.</div>}
          {sorted.map((c, i) => {
            const prev = sorted[i + 1];
            const len = prev ? daysBetween(prev.start, c.start) : null;
            return (
              <div key={c.id} style={{ background: "#1e1a2e", borderRadius: 16, padding: "16px 18px", marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 600, color: "#e8deff" }}>🌸 {getDayLabel(c.start)}</div>
                  {len && <div style={{ fontSize: 12, color: "#7b6f9a", marginTop: 3 }}>Cycle length: {len} days</div>}
                </div>
                <button onClick={() => deleteCycle(c.id)} style={{ background: "none", border: "1px solid #3a2e54", borderRadius: 10, color: "#7b6f9a", padding: "6px 12px", cursor: "pointer", fontSize: 13 }}>
                  Remove
                </button>
              </div>
            );
          })}
        </div>
      )}

      {view === "settings" && (
        <SettingsView cycleLength={cycleLength} periodLength={periodLength} onSave={updateSettings} />
      )}

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 420, background: "#13111a", borderTop: "1px solid #2a2040", display: "flex", justifyContent: "space-around", padding: "12px 0 20px" }}>
        {[
          { id: "home", label: "Home", icon: "🏠" },
          { id: "history", label: "History", icon: "📋" },
          { id: "settings", label: "Settings", icon: "⚙️" },
        ].map((t) => (
          <button key={t.id} onClick={() => setView(t.id)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: view === t.id ? "#e05c7a" : "#6b5f88", fontSize: 11, fontWeight: view === t.id ? 700 : 400 }}>
            <span style={{ fontSize: 20 }}>{t.icon}</span>
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function SettingsView({ cycleLength, periodLength, onSave }) {
  const [cl, setCl] = useState(cycleLength);
  const [pl, setPl] = useState(periodLength);

  return (
    <div style={{ padding: "40px 24px 0" }}>
      <div style={{ fontSize: 13, color: "#a89fc4", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 4 }}>Settings</div>
      <div style={{ fontSize: 24, fontWeight: 700, marginBottom: 24 }}>Preferences</div>

      {[
        { label: "Typical cycle length", sub: "Usually 21–35 days", val: cl, set: setCl, min: 14, max: 50 },
        { label: "Period duration", sub: "Usually 3–7 days", val: pl, set: setPl, min: 1, max: 10 },
      ].map(({ label, sub, val, set, min, max }) => (
        <div key={label} style={{ background: "#1e1a2e", borderRadius: 16, padding: "18px", marginBottom: 12 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: "#e8deff", marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 12, color: "#7b6f9a", marginBottom: 12 }}>{sub}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <button onClick={() => set(Math.max(min, val - 1))} style={{ width: 36, height: 36, borderRadius: 10, background: "#2a2040", border: "none", color: "#e8deff", fontSize: 20, cursor: "pointer" }}>−</button>
            <div style={{ fontSize: 24, fontWeight: 700, color: "#e05c7a", minWidth: 48, textAlign: "center" }}>{val}</div>
            <button onClick={() => set(Math.min(max, val + 1))} style={{ width: 36, height: 36, borderRadius: 10, background: "#2a2040", border: "none", color: "#e8deff", fontSize: 20, cursor: "pointer" }}>+</button>
            <span style={{ fontSize: 13, color: "#7b6f9a" }}>days</span>
          </div>
        </div>
      ))}

      <button onClick={() => onSave(cl, pl)} style={{ width: "100%", marginTop: 8, padding: "16px", background: "#e05c7a", border: "none", borderRadius: 16, color: "#fff", fontSize: 16, fontWeight: 600, cursor: "pointer" }}>
        Save settings
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PeriodTracker />);
</script>
</body>
</html>
